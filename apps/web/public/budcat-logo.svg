  <!-- Whiskers -->
  <g stroke="#7C2D12" strokeWidth="1.5" strokeLinecap="round" opacity="0.8">
    <path d="M 22 60 L 6 57" />
    <path d="M 22 65 L 5 69" />
    <path d="M 78 60 L 94 57" />
    <path d="M 78 65 L 95 69" />
