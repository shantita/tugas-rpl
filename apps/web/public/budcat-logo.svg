<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="budCatFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFA044" />
      <stop offset="60%" stopColor="#F97316" />
      <stop offset="100%" stopColor="#EA580C" />
    </linearGradient>
    <linearGradient id="budCatMuzzle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#FFEDD5" />
    </linearGradient>
    <linearGradient id="budCatEarPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FDA4AF" />
      <stop offset="100%" stopColor="#F43F5E" />
    </linearGradient>
  </defs>

  <!-- Left Ear -->
  <path d="M 22 45 Q 12 10 35 18 Q 44 32 40 44 Z" fill="url(#budCatFur)" stroke="#C2410C" strokeWidth="1.5" />
  <path d="M 24 40 Q 18 18 34 22 Q 39 30 37 40 Z" fill="url(#budCatEarPink)" />

  <!-- Right Ear -->
  <path d="M 78 45 Q 88 10 65 18 Q 56 32 60 44 Z" fill="url(#budCatFur)" stroke="#C2410C" strokeWidth="1.5" />
  <path d="M 76 40 Q 82 18 66 22 Q 61 30 63 40 Z" fill="url(#budCatEarPink)" />

  <!-- Chubby Head -->
  <path d="M 20 54 C 15 36 28 26 50 26 C 72 26 85 36 80 54 C 86 62 84 74 74 80 C 62 86 38 86 26 80 C 16 74 14 62 20 54 Z" fill="url(#budCatFur)" stroke="#C2410C" strokeWidth="1.8" />

  <!-- Forehead Stripes -->
  <path d="M 50 28 L 50 37" stroke="#9A3412" strokeWidth="2.5" strokeLinecap="round" />
  <path d="M 43 30 Q 45 35 47 38" stroke="#9A3412" strokeWidth="2" strokeLinecap="round" />
  <path d="M 57 30 Q 55 35 53 38" stroke="#9A3412" strokeWidth="2" strokeLinecap="round" />

  <!-- Creamy White Muzzle -->
